<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css">
<style>
  /* Hallmark · pre-emit critique: P4 H5 E4 S5 R5 V4 */
  /* Telegram 1,000-member milestone · left-anchored count + inbound paper plane */
  :root { --ground-shadow: #59436e; }

  .masthead { position: absolute; top: 48px; left: 72px; right: 72px; display: flex; align-items: center; justify-content: space-between; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
  .edition, .address { font-family: var(--font-mono); font-size: 19px; font-weight: 500; }
  .edition { display: flex; align-items: center; gap: 12px; }
  .edition::before { content: ''; width: 10px; height: 10px; background: var(--violet); }
  .address { color: var(--violet-2); }

  .lead { position: absolute; top: 168px; left: 72px; color: var(--violet-2); font-size: 44px; font-weight: 500; letter-spacing: 0; }
  .count { position: absolute; top: 210px; left: 56px; font-size: 300px; line-height: 1.04; font-weight: 700; letter-spacing: -.03em; color: var(--paper); }
  .unit { position: absolute; top: 556px; left: 72px; font-size: 64px; font-weight: 500; letter-spacing: -.015em; color: var(--paper); }

  .horizon { position: absolute; left: 72px; right: 72px; top: 744px; border-top: 1px solid var(--line); }
  .stage-label { position: absolute; top: 762px; font-family: var(--font-mono); font-size: 15px; font-weight: 500; color: var(--dim); }
  .stage-label.left { left: 72px; }
  .stage-label.right { right: 72px; }

  .flight { position: absolute; left: 0; top: 440px; width: 1600px; height: 340px; }
  .flight .trail { fill: none; stroke: var(--violet); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 1 17; }
  .flight .edge { fill: var(--bg); stroke: var(--dim); stroke-width: 2; stroke-linejoin: round; }
  .flight .side { fill: var(--line); stroke: var(--dim); stroke-width: 2; stroke-linejoin: round; }
  .flight .detail { fill: none; stroke: var(--dim); stroke-width: 1.5; stroke-linecap: round; }
  .flight .accent { fill: var(--violet); }

  .mascot { position: absolute; left: 1230px; bottom: 158px; width: 180px; height: auto; }
  .mascot-shadow { position: absolute; left: 1216px; top: 733px; width: 208px; height: 19px; border-radius: 50%; background: var(--ground-shadow); filter: blur(12px); opacity: .22; }

  .footer { position: absolute; left: 72px; right: 72px; bottom: 43px; display: flex; justify-content: space-between; align-items: center; }
  .footer p { font-size: 29px; font-weight: 500; }
  .footer .signature { display: flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 16px; color: var(--violet-2); }
  .signature img { width: 25px; height: auto; }
</style></head>
<body><main class="card">
  <header class="masthead"><span class="edition">COMMUNITY MILESTONE</span><span class="address">memoh.ai</span></header>

  <p class="lead">Our Telegram community just reached</p>
  <h1 class="count">1,000</h1>
  <p class="unit">members.</p>

  <div class="horizon" aria-hidden="true"></div>
  <span class="stage-label left">THE FIRST THOUSAND</span>
  <span class="stage-label right">AND COUNTING</span>

  <svg class="flight" viewBox="0 0 1600 340" role="img" aria-label="A paper plane glides along a dotted flight path, coming in to land beside the Memoh mascot">
    <path class="trail" d="M-20 238 C 320 228, 630 196, 836 52"/>
    <g transform="translate(880 20) rotate(18)">
      <path class="edge" d="M0 0 L260 50 L66 58 Z"/>
      <path class="side" d="M260 50 L66 58 L20 120 Z"/>
      <path class="detail" d="M66 58 L76 84"/>
    </g>
    <path class="trail" d="M1124 166 C 1152 204, 1174 248, 1190 294" opacity=".6"/>
  </svg>

  <div class="mascot-shadow" aria-hidden="true"></div>
  <img class="mascot" src="../assets/logo.png" alt="Memoh mascot waiting on the horizon">

  <footer class="footer"><p>Thank you for building with us.</p><span class="signature"><img src="../assets/logo.png" alt="">Memoh</span></footer>
</main></body></html>
